<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>Thiệp Cưới · Mạnh Thắng &amp; Đỗ Thảo</title>
  <meta name="description" content="Trân trọng kính mời bạn đến dự lễ dạm ngõ của Mạnh Thắng và Đỗ Thảo." />

  <meta name="theme-color" content="#f4cddd" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Thiệp cưới" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Dancing+Script:wght@500;600;700&family=Great+Vibes&family=Allura&family=Alex+Brush&family=Be+Vietnam+Pro:wght@300;400;500&display=swap"
    rel="stylesheet"
  />

  <style>
    @font-face {
      font-family: "UTM Edwardian";
      src: url("fonts/UTM-Edwardian.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --rose-deep: #6f3f4d;
      --rose: #a5606f;
      --rose-soft: #d49cae;
      --gold: #d3b177;
      --gold-deep: #b8912f;
      --paper: #fff8fa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #f6dbe4;
    }

    body {
      font-family: "Be Vietnam Pro", system-ui, sans-serif;
      color: var(--rose-deep);
      -webkit-font-smoothing: antialiased;
    }

    /* ================= STAGE full screen ================= */
    .stage {
      position: fixed;
      inset: 0;
      height: 100dvh;
      display: grid;
      place-items: center;
      padding: 2.2vmin;
      padding:
        max(2.2vmin, env(safe-area-inset-top))
        max(2.2vmin, env(safe-area-inset-right))
        max(2.2vmin, env(safe-area-inset-bottom))
        max(2.2vmin, env(safe-area-inset-left));
      background:
        radial-gradient(120vmin 70vmin at 50% -10%, #ffffff 0%, #fde7ef 42%, #f4c9d9 78%, #eeb6cc 100%);
    }

    .card {
      position: relative;
      width: 100%;
      height: 100%;
      border: 0.32vmin solid var(--gold);
      border-radius: 1vmin;
      background: linear-gradient(160deg, #fffefe 0%, var(--paper) 52%, #fdeef4 100%);
      box-shadow:
        0 0 0 0.12vmin #f3dbe4 inset,
        0 3vmin 8vmin -4vmin rgba(111, 63, 77, .5) inset,
        0 2vmin 6vmin -3vmin rgba(111, 63, 77, .35);
      overflow: hidden;
      animation: rise 1s cubic-bezier(.2,.7,.2,1) both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(2vmin); }
      to   { opacity: 1; transform: none; }
    }

    /* khung viền kép */
    .card::before {
      content: "";
      position: absolute;
      inset: 1.4vmin;
      border: 0.14vmin solid rgba(211, 177, 119, .85);
      border-radius: .6vmin;
      pointer-events: none;
      z-index: 3;
    }
    .card::after {
      content: "";
      position: absolute;
      inset: 2.3vmin;
      border: 0.1vmin solid rgba(201, 142, 160, .45);
      border-radius: .4vmin;
      pointer-events: none;
      z-index: 3;
    }

    /* lớp hoa góc */
    .corner-wrap {
      position: absolute;
      display: block;
      width: min(40vmin, 34vw);
      height: min(40vmin, 34vw);
      pointer-events: none;
      z-index: 1;
      filter: drop-shadow(0 1vmin 2vmin rgba(165, 96, 111, .18));
    }
    .corner-wrap.tl { top: 1.6vmin; left: 1.6vmin; }
    .corner-wrap.tr { top: 1.6vmin; right: 1.6vmin; transform: scaleX(-1); }
    .corner-wrap.bl { bottom: 1.6vmin; left: 1.6vmin; transform: scaleY(-1); }
    .corner-wrap.br { bottom: 1.6vmin; right: 1.6vmin; transform: scale(-1, -1); }

    .corner {
      display: block;
      width: 100%;
      height: 100%;
      transform-origin: 14% 14%;
      animation: sway 7.5s ease-in-out infinite;
      will-change: transform;
    }
    .corner-wrap.tr .corner { animation-duration: 8.4s; animation-delay: -1.6s; }
    .corner-wrap.bl .corner { animation-duration: 7.9s; animation-delay: -3.1s; }
    .corner-wrap.br .corner { animation-duration: 8.8s; animation-delay: -4.6s; }

    @keyframes sway {
      0%, 100% { transform: rotate(0deg) scale(1); }
      50%      { transform: rotate(3.5deg) scale(1.035); }
    }
    @media (prefers-reduced-motion: reduce) {
      .corner { animation: none; }
    }

    /* ================= CONTENT ================= */
    .content {
      position: relative;
      z-index: 4;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;
      text-align: center;
      padding: 4vmin 14vmin;
    }

    .kicker {
      font-family: "Cormorant Garamond", serif;
      letter-spacing: .5em;
      text-indent: .5em;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--rose);
      font-size: clamp(16px, 3.6vmin, 46px);
    }

    .names-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      width: min(100%, 94vmin);
      margin-inline: auto;
      gap: 3vmin;
    }

    .names {
      justify-self: center;
      font-family: "UTM Edwardian", "Great Vibes", "Dancing Script", cursive;
      color: var(--rose);
      text-align: center;
      line-height: 1.05;
      font-weight: 400;
      font-size: clamp(34px, 11vmin, 168px);
      text-shadow: 0 .3vmin 0 rgba(255,255,255,.85), 0 1vmin 2vmin rgba(165,96,111,.18);
      flex: 0 0 auto;
    }

    .double-happiness {
      width: clamp(70px, 29vmin, 340px);
      height: clamp(70px, 29vmin, 340px);
      display: block;
      fill: rgba(248, 204, 217, .30);
      stroke: var(--rose-soft);
      stroke-width: 20;
      stroke-linejoin: round;
      filter: drop-shadow(0 1.2vmin 2.4vmin rgba(201,142,160,.35));
      user-select: none;
      flex: 0 0 auto;
    }

    .verse {
      font-family: "Cormorant Garamond", serif;
      font-style: italic;
      font-size: clamp(14px, 3vmin, 38px);
      color: #8a5b66;
      max-width: 62ch;
      line-height: 1.5;
    }

    #verseText { min-height: 3.05em; }

    .divider-orn {
      display: flex;
      align-items: center;
      gap: 2.2vmin;
      width: min(70%, 120vmin);
      color: var(--gold-deep);
    }
    .rule {
      height: 0.12vmin;
      flex: 1;
      background: linear-gradient(90deg, transparent, var(--gold) 20%, var(--gold) 80%, transparent);
    }
    .divider-orn svg { width: 3vmin; height: 3vmin; min-width: 16px; }

    .date-block { display: flex; flex-direction: column; align-items: center; gap: 2vmin; }

    .month {
      font-family: "Cormorant Garamond", serif;
      letter-spacing: .42em;
      text-indent: .42em;
      text-transform: uppercase;
      color: var(--rose);
      font-weight: 600;
      font-size: clamp(14px, 3vmin, 36px);
    }

    .date-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3vmin;
    }
    .weekday, .lunar {
      font-family: "Cormorant Garamond", serif;
      color: #8a5b66;
      font-size: clamp(11px, 2.1vmin, 26px);
      text-transform: uppercase;
      letter-spacing: .14em;
      line-height: 1.3;
    }
    .lunar { text-transform: none; letter-spacing: .05em; font-style: italic; white-space: nowrap; }
    .day-num {
      font-family: "Be Vietnam Pro", system-ui, sans-serif;
      font-weight: 600;
      color: var(--rose-deep);
      font-size: clamp(38px, 13vmin, 150px);
      line-height: 1;
      letter-spacing: .02em;
      font-variant-numeric: lining-nums tabular-nums;
      font-feature-settings: "lnum" 1, "tnum" 1;
    }

    .year {
      font-family: "Be Vietnam Pro", system-ui, sans-serif;
      font-weight: 500;
      letter-spacing: .6em;
      text-indent: .6em;
      color: var(--rose);
      font-size: clamp(14px, 3.2vmin, 38px);
      font-variant-numeric: lining-nums tabular-nums;
      font-feature-settings: "lnum" 1, "tnum" 1;
    }

    /* ================= Cánh hoa rơi ================= */
    .petals { position: absolute; inset: 0; overflow: hidden; z-index: 2; pointer-events: none; }
    .petal {
      position: absolute;
      top: -6%;
      width: 1.8vmin;
      height: 2.6vmin;
      min-width: 8px;
      min-height: 12px;
      background: radial-gradient(circle at 35% 30%, #ffe3ec, #f6b9cd 65%, #eb9bb6);
      border-radius: 60% 40% 55% 45% / 60% 60% 40% 40%;
      opacity: .0;
      animation: fall linear infinite;
    }
    @keyframes fall {
      0%   { transform: translate3d(0, -10vh, 0) rotate(0deg); opacity: 0; }
      10%  { opacity: .65; }
      90%  { opacity: .55; }
      100% { transform: translate3d(6vmin, 112vh, 0) rotate(420deg); opacity: 0; }
    }

    /* ================= Bìa mở thiệp ================= */
    .cover {
      position: fixed;
      inset: 0;
      z-index: 90;
      display: grid;
      place-items: center;
      background: radial-gradient(90vmin 60vmin at 50% 20%, #fff 0%, #fbe3ec 60%, #f4cddd 100%);
      transition: opacity .9s ease, visibility .9s ease;
    }
    .cover.hidden { opacity: 0; visibility: hidden; }
    .cover-frame {
      width: min(52vmin, 76vw);
      aspect-ratio: 1 / 1.34;
      border: 0.3vmin solid var(--gold);
      border-radius: 1vmin;
      background: linear-gradient(160deg, #fffdfd, #fdf0f5);
      box-shadow: 0 0 0 0.12vmin #f3dbe4 inset, 0 3vmin 8vmin -3vmin rgba(111,63,77,.55);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.6vmin;
      position: relative;
      overflow: hidden;
      padding: 5vmin;
      text-align: center;
      animation: rise 1s .1s both;
    }
    .cover .kicker { font-size: clamp(12px, 2.2vmin, 26px); }
    .cover .double-happiness { width: clamp(46px, 14vmin, 120px); height: clamp(46px, 14vmin, 120px); }
    .cover .names {
      display: block;
      height: auto;
      font-size: clamp(26px, 7vmin, 64px);
      line-height: 1.15;
    }
    .cover .verse { font-size: clamp(12px, 2.3vmin, 22px); }

    .btn-open {
      font-family: "Cormorant Garamond", serif;
      letter-spacing: .22em;
      text-indent: .22em;
      text-transform: uppercase;
      font-size: clamp(12px, 2.2vmin, 20px);
      color: #fff;
      background: linear-gradient(135deg, #c98ea0, #a5606f);
      border: none;
      padding: 1.4vmin 4vmin;
      border-radius: 999px;
      cursor: pointer;
      margin-top: 1vmin;
      box-shadow: 0 1.4vmin 3vmin -1.2vmin rgba(165,96,111,.95);
      transition: transform .15s ease, filter .2s ease;
    }
    .btn-open:hover { transform: translateY(-2px); filter: brightness(1.06); }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 3vmin;
      transform: translate(-50%, 2vmin);
      background: rgba(111,63,77,.95);
      color: #fff;
      padding: 1.2vmin 2.6vmin;
      border-radius: 14px;
      max-width: min(88vw, 560px);
      text-align: center;
      line-height: 1.4;
      font-size: clamp(12px, 1.8vmin, 18px);
      opacity: 0;
      transition: .3s ease;
      z-index: 100;
      pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    audio { display: none; }
  </style>
</head>

  <!-- Nhạc nền violin-cover (phát đi phát lại): music.mp3 copy từ Downloads/violin-cover.mp3 -->
  <audio id="music" loop preload="auto" src="music.mp3"></audio>

  <script>
    (function () {
      const cover = document.getElementById("cover");
      const music = document.getElementById("music");
      const toastEl = document.getElementById("toast");
      let toastTimer;

      function toast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastEl.classList.remove("show"), 4200);
      }

      /* --- cánh hoa rơi --- */
      (function makePetals() {
        const box = document.getElementById("petals");
        const n = 14;
        for (let i = 0; i < n; i++) {
          const p = document.createElement("span");
          p.className = "petal";
          p.style.left = Math.random() * 100 + "%";
          p.style.animationDuration = (12 + Math.random() * 12) + "s";
          p.style.animationDelay = (-Math.random() * 20) + "s";
          p.style.transform = "scale(" + (0.6 + Math.random() * 0.9) + ")";
          box.appendChild(p);
        }
      })();

      const isIOS =
        /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      const isStandalone =
        window.navigator.standalone === true ||
        window.matchMedia("(display-mode: fullscreen)").matches ||
        window.matchMedia("(display-mode: standalone)").matches;

      function goFullscreen() {
        const el = document.documentElement;
        if (!document.fullscreenElement && el.requestFullscreen) {
          el.requestFullscreen().catch(() => {});
        } else if (!document.fullscreenElement && el.webkitRequestFullscreen) {
          el.webkitRequestFullscreen();
        }
      }

      let opened = false;
      function openInvitation() {
        if (opened) return;
        opened = true;
        cover.classList.add("hidden");
        goFullscreen();
        // Phát đi phát lại bài violin-cover
        music.loop = true;
        if (music.getAttribute("src")) music.play().catch(() => {});
        setTimeout(() => { cover.style.display = "none"; }, 950);
        if (isIOS && !isStandalone) {
          setTimeout(() => toast("iPhone: bấm Chia sẻ → Thêm vào Màn hình chính để mở toàn màn hình"), 1200);
        }
      }

      /* bấm nút hoặc bấm OK trên remote TV / chạm bất kỳ */
      cover.addEventListener("click", openInvitation);
      document.addEventListener("keydown", function (e) {
        if (!opened && (e.key === "Enter" || e.key === " " || e.keyCode === 13)) openInvitation();
      });

      /* --- hiệu ứng gõ chữ cho lời cảm ơn (lặp vô hạn) --- */
      (function typewriter() {
        const el = document.getElementById("verseText");
        if (!el) return;
        const full = el.dataset.text || el.textContent.trim();
        const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (reduce) { el.textContent = full; return; }

        let i = 0;
        el.textContent = "";

        function tick() {
          i++;
          el.textContent = full.slice(0, i);
          if (i >= full.length) {
            setTimeout(() => {
              el.textContent = "";
              i = 0;
              setTimeout(tick, 600);
            }, 2800);
          } else {
            setTimeout(tick, 55);
          }
        }
        setTimeout(tick, 900);
      })();

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("sw.js").catch(() => {});
        });
      }
    })();
  </script>
